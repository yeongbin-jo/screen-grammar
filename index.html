<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>화면의 문법</title>
<meta name="description" content="웹 디자인과 모션의 핵심 원리를 움직이는 다이어그램으로 한 단계씩 배우는 인터랙티브 강의">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preload" href="fonts/Paperlogy-4Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<script>try{if(JSON.parse(localStorage.getItem("hwamyeon-theme"))==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="lessons-look-type.css">
<link rel="stylesheet" href="lessons-color-motion.css">
<link rel="stylesheet" href="lessons-mograph.css">
<link rel="stylesheet" href="lessons-camera2.css">
<link rel="stylesheet" href="lessons-web.css">
<link rel="stylesheet" href="lessons-data.css">
<link rel="stylesheet" href="lessons-gpu.css">
<link rel="stylesheet" href="lessons-video.css">

</head>
<body>
<div class="window">
  <header class="topnav">
    <button class="icon-btn only-narrow" id="courseBtn" aria-controls="side" aria-label="코스 열기">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a class="logo" href="#">
      <span class="logo__mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="logo__text">화면의 <mark>문법</mark></span>
    </a>
    <nav class="nav" aria-label="보기">
      <a class="nav__item" id="navWeb" href="#web"><svg viewBox="0 0 24 24"><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4H10a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4.5A1.5 1.5 0 0 1 3 16.5zM21 5.5A1.5 1.5 0 0 0 19.5 4H14a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>웹·모션</a>
      <a class="nav__item" id="navVideo" href="#video"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10.5 5-3v9l-5-3"/></svg>영상</a>
      <a class="nav__item" id="navGloss" href="#glossary">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>용어집</a>
    </nav>
    <div class="topnav__end">
      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input id="search" type="search" placeholder="레슨과 용어 검색…" autocomplete="off">
        <kbd>⌘K</kbd>
      </label>
      <button class="icon-btn" id="themeBtn" aria-label="다크 모드 전환">
        <svg class="ti ti-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="ti ti-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="side" id="side">
      <section class="card course">
        <div class="course__head">
          <svg class="folder folder--ink" viewBox="0 0 24 24"><path d="M2.5 6.5A1.5 1.5 0 0 1 4 5h5l2 2h9a1.5 1.5 0 0 1 1.5 1.5v10A1.5 1.5 0 0 1 20 20H4a1.5 1.5 0 0 1-1.5-1.5z"/></svg>
          <b id="trackName">코스</b><span class="muted" id="lessonCount"></span>
        </div>
        <nav id="tree" aria-label="코스 목차"></nav>
      </section>
      <p class="credit">형식과 스타일은 <a href="https://designed-to-scale.vercel.app/" target="_blank" rel="noopener">Designed to Scale</a>(<a href="https://x.com/DilumSanjaya" target="_blank" rel="noopener">@DilumSanjaya</a>)에서 영감을 받았습니다.</p>
      <section class="card progress">
        <span>진행</span><span id="progressText" class="num"></span><i class="progress__bar" id="progressBar"></i>
      </section>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <main class="sheet" id="sheet">
      <div id="lessonView">
        <header class="lesson-head">
          <div class="lesson-head__main">
            <p class="crumb" id="crumb"></p>
            <h1 class="title" id="title"></h1>
            <p class="subtitle" id="lede"></p>
          </div>
          <div class="tags" id="tags"></div>
        </header>

        <section class="stage-card">
          <div class="stage-tools">
            <button class="tool" id="replayBtn"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg>다시 보기</button>
            <button class="tool" id="playBtn"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14M16 5v14"/></svg><span id="playLabel">일시정지</span></button>
            <button class="tool" id="slowBtn" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M12 13V9M10 3h4"/></svg>×¼</button>
          </div>
          <div class="stage" id="stage"></div>
          <div class="stage-foot"><span id="tTime" class="num">0 ms</span></div>
        </section>

        <section class="card timeline">
          <div class="timeline__head"><b>이 레슨에서</b><span class="muted" id="tlCount"></span></div>
          <ol class="timeline__steps" id="steps"></ol>
        </section>
      </div>

      <div id="glossView" hidden>
        <header class="lesson-head">
          <div class="lesson-head__main">
            <p class="crumb">용어집</p>
            <h1 class="title">업계 용어 한눈에</h1>
            <p class="subtitle">모든 레슨의 용어를 장별로 모았습니다. 용어를 누르면 그 레슨으로 이동합니다.</p>
          </div>
        </header>
        <div id="gloss" class="gloss"></div>
      </div>
    </main>

    <aside class="rail" id="rail">
      <section class="card guide">
        <div class="guide__meta"><span class="num" id="stepNo"></span><span class="chapter" id="chapterChip"></span></div>
        <div class="guide__content" id="guide">
          <h2 class="guide__title" id="stepTitle"></h2>
          <div class="guide__body"><p id="stepText"></p></div>
          <div class="callout" id="callout" hidden>
            <span class="callout__icon"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg></span>
            <div><p class="callout__label">핵심</p><p id="calloutText"></p></div>
          </div>
        </div>
        <div class="guide__nav">
          <button class="btn-ghost" id="prevBtn"><svg viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></svg>뒤로</button>
          <button class="btn-pop btn-next" id="nextBtn"><span id="nextLabel">다음</span><svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
        </div>
        <p class="keys-hint"><kbd>←</kbd><kbd>→</kbd> 단계 · <kbd>R</kbd> 다시 보기 · <kbd>Space</kbd> 일시정지</p>
      </section>

      <section class="card panel" id="panel">
        <div class="tabs" role="tablist" aria-label="레슨 도구">
          <button class="tab" role="tab" data-pane="playWrap">직접 해보기</button>
          <button class="tab" role="tab" data-pane="codeWrap">코드</button>
          <button class="tab" role="tab" data-pane="termsWrap">용어</button>
          <button class="tab" role="tab" data-pane="goalsWrap">배울 내용</button>
        </div>
        <div class="panes">
          <div class="pane" id="playWrap" role="tabpanel"><div id="controls" class="controls"></div></div>
          <div class="pane" id="codeWrap" role="tabpanel"><div class="eyebrow" id="codeTitle">코드</div><pre id="code"></pre></div>
          <div class="pane terms" id="termsWrap" role="tabpanel"><dl id="terms"></dl></div>
          <div class="pane goals" id="goalsWrap" role="tabpanel"><ul id="goals"></ul></div>
        </div>
      </section>
    </aside>
  </div>
</div>

<script src="lib.js"></script>
<script src="art.js"></script>
<script src="lessons-design.js"></script>
<script src="lessons-motion.js"></script>
<script src="lessons-camera.js"></script>
<script src="lessons-render.js"></script>
<script src="lessons-look-type.js"></script>
<script src="lessons-color-motion.js"></script>
<script src="lessons-mograph.js"></script>
<script src="lessons-camera2.js"></script>
<script src="lessons-web.js"></script>
<script src="lessons-data.js"></script>
<script src="lessons-gpu.js"></script>
<script src="lessons-video.js"></script>
<script src="app.js"></script>
</body>
</html>
