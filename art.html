<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M.art 갤러리</title>
<link rel="stylesheet" href="style.css">
<style>
  body { background: var(--bg); color: var(--ink); padding: 24px; overflow: auto; height: auto; }
  html { height: auto; overflow: auto; }
  h1 { font: 800 20px var(--display); margin: 0 0 4px; }
  h2 { font: 700 14px var(--f); margin: 28px 0 8px; color: var(--ink2); }
  p.note { color: var(--muted); margin: 0 0 12px; font-size: 12.5px; }
  .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  canvas.g { display: block; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
</style>
</head>
<body>
<div class="bar"><h1>M.art 갤러리</h1><button class="btn-ghost" id="tg" style="padding:4px 10px">테마 전환</button></div>
<p class="note">영상 트랙 공용 일러스트 키트 검증용. ?theme=dark 로 다크 모드.</p>
<div id="root"></div>
<script src="lib.js"></script>
<script src="art.js"></script>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  if (q.get("theme")) document.documentElement.dataset.theme = q.get("theme");
  document.getElementById("tg").onclick = () => { const d = document.documentElement; d.dataset.theme = d.dataset.theme === "dark" ? "light" : "dark"; M.resetCols(); };
  const root = document.getElementById("root");
  const secs = [];
  const sec = (title, h, draw, id) => {
    root.append(M.el("h2", {}, title));
    const cv = M.el("canvas", { class: "g", id: id || "" }); cv.style.height = h + "px"; root.append(cv);
    secs.push({ cv, draw });
  };
  const VIEWS = ["front", "three-quarter-right", "profile-right", "back", "three-quarter-left", "profile-left"];
  const EXPRS = ["neutral", "smile", "sad", "surprised", "worried", "talk"];
  const lab = (x, s, px, py, o = {}) => M.text(x, s, px, py, { size: 11, align: "center", color: M.col().muted, mono: true, ...o });

  sec("person — 6방향 (A, B)", 380, (x, w, h, t) => {
    const n = 12, cw = w / n;
    VIEWS.forEach((v, i) => ["A", "B"].forEach((who, j) => {
      const cx = cw * (i * 2 + j + 0.5);
      M.art.person(x, { cx, cy: h - 40, h: 290, who, view: v });
      if (j === 0) lab(x, v.replace("three-quarter", "3/4"), cx + cw / 2, h - 12);
    }));
  }, "s-views");

  for (const who of ["A", "B"]) sec(`head — view × expr (${who})`, 6 * 108 + 30, (x, w, h, t) => {
    const cw = (w - 90) / 6, rh = 108;
    EXPRS.forEach((e, r) => {
      lab(x, e, 44, 30 + r * rh + 56);
      VIEWS.forEach((v, i) => {
        x.save(); x.beginPath(); x.rect(90 + cw * i + 4, 26 + r * rh, cw - 8, rh - 6); x.clip();
        M.art.head(x, { cx: 90 + cw * (i + 0.5), cy: 30 + r * rh + 46, r: 34, who, view: v, expr: e, mouth: e === "talk" ? 0.5 + 0.5 * Math.sin(t / 90) : undefined });
        x.restore();
      });
    });
    VIEWS.forEach((v, i) => lab(x, v.replace("three-quarter", "3/4"), 90 + cw * (i + 0.5), 16));
  }, "s-head-" + who);

  sec("pose — stand / sit / walk(위상 0, .25, .5, .75) / point / wave", 360, (x, w, h, t) => {
    const items = [
      ["A", "stand", "three-quarter-right"], ["B", "sit", "profile-right"], ["A", "sit", "front"],
      ["A", "walk", "profile-right", 0], ["A", "walk", "profile-right", 0.25], ["A", "walk", "profile-right", 0.5], ["A", "walk", "profile-right", 0.75],
      ["B", "walk", "three-quarter-left", (t / 1100) % 1], ["B", "point", "front"], ["A", "point", "three-quarter-right"], ["B", "wave", "front", (t / 1000) % 1], ["A", "wave", "profile-left", 0.3],
    ];
    const cw = w / items.length;
    items.forEach(([who, pose, view, phase], i) => {
      const cx = cw * (i + 0.5), cy = h - 40;
      if (pose === "sit") {
        M.art.prop(x, "chair", { cx, cy, s: 250 * 0.46 });
      }
      const r = M.art.person(x, { cx, cy, h: 250, who, view, pose, phase, expr: pose === "wave" ? "smile" : pose === "point" ? "talk" : "neutral" });
      if (i === 0) { x.strokeStyle = M.alpha(M.col().a, 0.6); x.setLineDash([3, 3]); x.strokeRect(r.bounds.x, r.bounds.y, r.bounds.w, r.bounds.h); x.setLineDash([]); M.dot(x, r.eyes.x, r.eyes.y, 2.5, M.col().b); }
      lab(x, pose + (phase != null && pose === "walk" && i < 7 ? " " + phase : ""), cx, h - 12);
    });
  }, "s-pose");

  sec("크기 40 → 600px (A, B 교대)", 640, (x, w, h, t) => {
    const hs = [40, 60, 90, 140, 220, 330, 600]; let px = 20;
    hs.forEach((H, i) => {
      const cx = px + Math.max(H * 0.16, 14);
      M.art.person(x, { cx, cy: h - 20, h: H, who: i % 2 ? "B" : "A", view: i % 2 ? "three-quarter-left" : "three-quarter-right", expr: "smile" });
      lab(x, H + "px", cx, h - 4);
      px += Math.max(H * 0.32, 30) + 26;
    });
  }, "s-size");

  sec("head 조명 — key/fill/rim 조합 6가지 + warm/soft", 300, (x, w, h, t) => {
    const L = [
      ["키만 45°", { dx: -0.75, dy: -0.4, key: 1, fill: 0, rim: 0 }],
      ["키+필", { dx: -0.75, dy: -0.4, key: 1, fill: 0.5, rim: 0 }],
      ["키+필+림", { dx: -0.75, dy: -0.4, key: 1, fill: 0.5, rim: 1 }],
      ["림만(역광)", { dx: 0, dy: -1, key: 0, fill: 0.08, rim: 1.2 }],
      ["정면 플랫", { dx: 0, dy: 0, key: 1, fill: 0.8, rim: 0 }],
      ["측광 하드", { dx: 1, dy: 0, key: 1, fill: 0.05, rim: 0.4 }],
      ["측광 소프트", { dx: 1, dy: -0.2, key: 1, fill: 0.15, rim: 0, soft: 1 }],
      ["따뜻한 키", { dx: -0.6, dy: -0.5, key: 1, fill: 0.35, warm: 0.8 }],
    ];
    const cw = w / L.length;
    L.forEach(([name, light], i) => {
      const cx = cw * (i + 0.5);
      x.fillStyle = "#2a2724"; x.fillRect(cx - cw / 2 + 6, 10, cw - 12, h - 40);
      x.save(); x.beginPath(); x.rect(cx - cw / 2 + 6, 10, cw - 12, h - 40); x.clip();
      M.art.head(x, { cx, cy: 110, r: 62, who: i % 2 ? "B" : "A", view: i === 2 ? "three-quarter-left" : "three-quarter-right", light });
      x.restore();
      lab(x, name, cx, h - 12, { mono: false });
    });
  }, "s-light");

  sec("prop", 260, (x, w, h, t) => {
    const K = ["chair", "table", "lamp", "plant", "window", "door", "mug", "bowl", "flower", "gift", "phone", "laptop", "car", "tree", "building"];
    const sz = { chair: 120, table: 80, lamp: 170, plant: 120, window: 150, door: 170, mug: 50, bowl: 50, flower: 110, gift: 70, phone: 70, laptop: 70, car: 60, tree: 170, building: 180 };
    const wid = { table: 2.2, car: 2.9, laptop: 1.7, building: 0.8, bowl: 1.3 };
    const tot = K.reduce((s, k) => s + sz[k] * (wid[k] || 0.9) + 14, 0), f = Math.min(1, (w - 20) / tot);
    let px = 10;
    K.forEach((k) => {
      const s = sz[k] * f, ww = s * (wid[k] || 0.9), cx = px + ww / 2;
      M.art.prop(x, k, { cx, cy: h - 34, s, time: t, steam: true });
      lab(x, k, cx, h - 12); px += ww + 14 * f;
    });
  }, "s-prop");

  sec("backdrop + frame — room / street / park / studio", 300, (x, w, h, t) => {
    const K = ["room", "street", "park", "studio"], cw = (w - 50) / 4;
    K.forEach((k, i) => {
      const fx = 10 + i * (cw + 10);
      M.art.frame(x, { x: fx, y: 10, w: cw, h: h - 20, label: ["WS", "MS", "LS", "MCU"][i], rec: i === 0, time: t, thirds: i === 2, aspect: i === 3 ? 2.39 : undefined, draw: (x, r) => {
        M.art.backdrop(x, k, { ...r, time: t });
        const flo = r.y + r.h * (k === "room" ? 0.9 : k === "street" ? 0.9 : k === "park" ? 0.95 : 0.85);
        if (k === "room") { M.art.prop(x, "table", { cx: r.x + r.w * 0.68, cy: flo - 4, s: r.h * 0.26 }); M.art.prop(x, "plant", { cx: r.x + r.w * 0.9, cy: flo - 6, s: r.h * 0.3 }); M.art.person(x, { cx: r.x + r.w * 0.36, cy: flo, h: r.h * 0.62, who: "A", view: "three-quarter-right", expr: "talk", mouth: 0.5 + 0.5 * Math.sin(t / 100) }); }
        if (k === "street") { M.art.prop(x, "car", { cx: r.x + r.w * 0.75, cy: r.y + r.h * 0.985, s: r.h * 0.2 }); M.art.person(x, { cx: r.x + ((r.w * 0.2 + t * 0.03) % r.w), cy: flo, h: r.h * 0.5, who: "B", view: "profile-right", pose: "walk", phase: (t / 1000) % 1 }); }
        if (k === "park") { M.art.person(x, { cx: r.x + r.w * 0.38, cy: flo, h: r.h * 0.45, who: "A", view: "three-quarter-right", pose: "wave", phase: (t / 900) % 1, expr: "smile" }); M.art.person(x, { cx: r.x + r.w * 0.62, cy: flo - 6, h: r.h * 0.43, who: "B", view: "three-quarter-left", expr: "smile" }); }
        if (k === "studio") M.art.head(x, { cx: r.x + r.w * 0.5, cy: r.y + r.h * 0.42, r: r.h * 0.2, who: "B", view: "front", expr: "neutral", light: { dx: -0.7, dy: -0.4, key: 1, fill: 0.4, rim: 0.6 } });
      } });
    });
  }, "s-bd");

  sec("clip + waveform", 190, (x, w, h, t) => {
    const c = M.col();
    const thumb = (k) => (x, r) => { M.art.backdrop(x, k, r); };
    M.art.clip(x, { x: 10, y: 14, w: w * 0.3, h: 46, color: c.a, label: "A 숏 · 와이드", sub: "00:04:12", thumb: thumb("room") });
    M.art.clip(x, { x: 14 + w * 0.3, y: 14, w: w * 0.22, h: 46, color: c.b, label: "B 리액션", sub: "00:02:03", thumb: (x, r) => M.art.head(x, { cx: r.x + r.w / 2, cy: r.y + r.h * 0.48, r: r.h * 0.32, who: "B", view: "three-quarter-left", expr: "surprised" }), selected: true });
    M.art.clip(x, { x: 18 + w * 0.52, y: 14, w: w * 0.16, h: 46, color: c.c, label: "인서트", thumb: thumb("park") });
    M.art.clip(x, { x: 22 + w * 0.68, y: 14, w: w * 0.3 - 32, h: 26, color: c.key, label: "타이틀" });
    M.art.clip(x, { x: 10, y: 70, w: w * 0.6, h: 50, color: c.c, label: "" });
    M.art.waveform(x, { x: 14, y: 76, w: w * 0.6 - 8, h: 40, seed: 3, color: c.c });
    M.art.clip(x, { x: 14 + w * 0.6, y: 70, w: w * 0.4 - 24, h: 50, color: c.a, label: "" });
    M.art.waveform(x, { x: 18 + w * 0.6, y: 76, w: w * 0.4 - 32, h: 40, seed: 7, density: 1.2, gain: 0.7, color: c.a });
    M.art.waveform(x, { x: 10, y: 132, w: w - 20, h: 46, seed: 11, density: 0.25, color: c.b });
  }, "s-clip");

  const loop = (t) => {
    for (const s of secs) { const { x, w, h } = M.fit(s.cv); s.draw(x, w, h, t); }
    if (!window.__still) requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
